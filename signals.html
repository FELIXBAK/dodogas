<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지표 설명 | dodogas</title>
<meta name="description" content="붐붐이 알림, 라인 차트, 지수 신호 게시판을 한곳에서 자세히 설명합니다.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%233f51d6%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3Ed%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="signals">
<main>
  <div class="container">
    <div class="page-head">
      <p class="eyebrow">signals</p>
      <h1>지표 설명</h1>
      <p class="lead">디스코드에서 올라오는 알림과 차트를 종류별로 나누어 설명합니다. 아래 목차로 원하는 부분으로 바로 이동하세요.</p>
    </div>
    <nav class="g-nav sg-nav" aria-label="목차">
      <a href="#boomboom">붐붐이</a><a href="#line">라인</a><a href="#index">지수</a>
    </nav>
    <div id="sg"></div>
    <section class="section">
      <p class="callout">보는 방법과 해석 기준 등 자세한 내용은 계속 보강될 예정입니다. 궁금한 점은 <a href="support.html">고객센터</a>에서 편하게 문의해 주세요.</p>
    </section>
  </div>
</main>
<script src="data.js"></script>
<script src="boards-data.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var TIERS = ["Basic", "Trillion", "VIP"];
  function info(n) { return BOARD_INFO.filter(function (b) { return b.name === n; })[0] || { minTier: 2, img: "" }; }
  var SECTIONS = [
    { id: "boomboom", title: "붐붐이",
      items: function () {
        var c = info("BOOM-BOOM-Alert"), m = info("붐붐이-m1-테스트"), s1 = info("붐붐이-보조1-테스트"), s2 = info("붐붐이-보조2-테스트");
        return [
          { name: "붐붐이 Lite", tierLabel: "전체 공개", badge: "텔레그램",
            summary: "텔레그램으로 누구나 무료로 보실 수 있는 붐붐이입니다. 단계 표시 없이 \u201CBBBB\u201D 문구와 알림 시각이 초 단위까지 표시됩니다.", imgs: ["img/boomboom-lite.png"] },
          { name: "BOOM-BOOM-Alert", minTier: c.minTier, badge: "기존 운영 버전",
            summary: "기존부터 운영해 온 붐붐이 알림입니다. BBBBLL1, BBBBSS2 같은 짧은 문구로 올라옵니다.", imgs: [c.img] },
          { name: "붐붐이 M1", minTier: m.minTier, badge: "베타 테스트",
            summary: "추가 보정이 들어간 붐붐이입니다. 현재는 베타 테스트로 임시 공개 중이며, 충분히 검증되어 믿고 보실 수 있게 되면 정식으로 출시할 예정입니다. \u201CLLLL 1\u201D, \u201CSSSS 2\u201D처럼 단계와 함께 올라오고, 알림 시각이 초 단위까지 표시됩니다.", imgs: [m.img] },
          { name: "붐붐이 보조 1 · 2 · 3", minTier: Math.max(s1.minTier, s2.minTier), badge: "베타 테스트",
            summary: "붐붐이 알림을 보완해 함께 참고하실 수 있는 보조 알림 3종입니다. 같은 카드 형태로 올라오며, 알림 시각이 초 단위까지 표시됩니다. 현재는 베타 테스트로 임시 공개 중입니다.", imgs: [s1.img, s2.img] }
        ];
      },
      intro: "붐붐이는 시장의 실시간 흐름을 계속 지켜보다가, 여러 가지 기준과 내부 기준값을 종합해 조건이 맞는 순간 디스코드로 바로 알려 드리는 알림입니다.\n붐붐이 Lite · M1 · 보조 알림은 알림 시각이 초 단위까지 함께 표시됩니다.\n알림 카드에는 \u201CLLLL 1\u201D, \u201CSSSS 2\u201D처럼 문구와 단계 숫자가 표시되고, 단계는 1단계부터 7단계까지 나뉘어 있습니다. (붐붐이 Lite는 단계 표시가 없습니다.)\n차트를 계속 보고 있지 않아도 흐름을 놓치지 않고 따라가실 수 있어요.",
      extra: '<a class="btn" href="' + esc((SERVICES.filter(function (s) { return s.name.indexOf("붐붐이 Lite") === 0; })[0] || {}).link || "#") + '" target="_blank" rel="noopener">텔레그램 붐붐이 Lite 열기</a>' },
    { id: "line", title: "라인",
      items: function () {
        var b1 = info("BOOST-PHASE_Line"), b2 = info("MID-COURSE_Line"), b3 = info("APOCALYPTIC_Line");
        function more(n, t) { var x = info(n); x.name = n; x.badge = "종목별 라인"; x.summary = t; return x; }
        return [
          { name: "BOOST-PHASE_Line", minTier: b1.minTier, badge: "단기 라인", imgs: [b1.img],
            summary: "로켓이 발사 직후 가장 먼저 점화하는 \u201C부스트 단계\u201D에서 이름을 따왔습니다. 현재 가격과 가까운 곳에서 많은 참여자가 몰려 있는 가격대를 표시하며, 새 라인이 비교적 빠르게 올라오는 단기 라인입니다. 가까운 목표를 빠르게 확인하고 싶을 때 보기 좋아요." },
          { name: "MID-COURSE_Line", minTier: b2.minTier, badge: "중장기 라인", imgs: [b2.img],
            summary: "로켓이 비행 중간 구간을 지나는 \u201C미드코스 단계\u201D에서 이름을 따왔습니다. 부스트 라인보다 올라오는 주기가 길고, 조금 더 멀리 보는 중장기 라인입니다. 큰 흐름 속에서 중간 목표를 가늠할 때 참고하기 좋아요." },
          { name: "APOCALYPTIC_Line", minTier: b3.minTier, badge: "장기 라인", imgs: [b3.img],
            summary: "로켓 발사의 마지막, 종말 단계에서 이름을 따왔습니다. 거의 최종 목표가에 가까운 수준의 가격대를 표시하는 장기 라인으로, 올라오는 주기도 가장 깁니다. 멀리 있는 큰 목표를 확인하고 싶을 때 참고해 보세요." },
          more("Line-altcoins", "알트코인 차트에 운영자가 라인을 표시해 올립니다. 코인별 차트에서 주목할 가격대를 간단히 확인하실 수 있어요. 멤버십 회원분이 보고 싶은 코인을 요청해 주시면, 운영자가 차트를 확인한 뒤 의미 있는 라인이 있을 때 이 게시판에 올려 드립니다."),
          more("Line-NASDAQ", "나스닥 차트에 운영자가 라인을 표시해 올립니다. 큰 흐름 속에서 주목할 가격대를 편하게 확인하세요."),
          more("Line-METALS", "금속 종목 차트에 운영자가 라인을 표시해 올립니다. 가격이 반응할 만한 가격대를 한눈에 볼 수 있어요."),
          more("Line-KOSPI-200", "코스피200 차트에 운영자가 라인을 표시해 올립니다. 지수가 반응할 만한 가격대를 확인하는 데 참고하세요.")
        ];
      },
      intro: "라인은 운영자가 TradingView 차트에 직접 표시해 올리는 \u201C주목할 가격대\u201D입니다.\n차트가 이 가격대에 가까워지면 잠시 멈추거나, 반등하거나, 조정을 받는 모습이 자주 나타납니다. 그래서 \u201C여기서 한 번 반응이 나올 수 있겠다\u201D 하고 미리 살펴볼 수 있는 기준선으로 활용하실 수 있어요.\n활용 방법은 간단해요.\n① 올라온 라인 이미지에서 현재 가격과 라인 사이의 거리를 확인합니다.\n② 라인에 가까워지면 반응이 나오는지 차트를 지켜봅니다.\n③ 반응 없이 라인을 지나가는 경우도 있으니, 다음 라인도 함께 확인합니다.\n라인은 참고용 기준선이며, 항상 같은 반응이 나온다는 뜻은 아닙니다. 판단과 매매는 본인의 기준으로 해 주세요." },
    { id: "index", title: "지수",
      items: function () {
        var d = info("DODO_index"), h = info("High_Leverage_Frenzy_index");
        return [
          { name: "DODO_index", minTier: d.minTier, imgs: [d.img],
            summary: "시장의 큰 쏠림을 짚어 주는 신호입니다. 시장이 한쪽으로 크게 치우치고, 전체적으로 쌓인 레버리지가 아주 많아졌을 때 올라옵니다.\n예를 들어 가격이 내려오면서 숏이 계속 쌓이고 한쪽의 쏠림이 극에 달하면, 그 자리에서 반대 방향으로 반등이 나오며 쌓여 있던 레버리지가 정리되는 모습이 자주 나타납니다. 그래서 흐름이 바뀌는 변곡점에 가까운 신호로 볼 수 있고, 큰 흐름의 방향을 점검할 때 참고하시면 좋아요.\n올라오는 간격은 일정하지 않으며, 항상 같은 결과가 나오는 것은 아니니 참고용으로 활용해 주세요." },
          { name: "High_Leverage_Frenzy_index", minTier: h.minTier, badge: "신규 오픈", imgs: [h.img],
            summary: "고배율 레버러지가 얼마나 광적으로 많이 걸렸는지를 보여 주는 지수입니다. 아래 세 가지 신호가 올라오며, 올라오는 간격은 일정하지 않습니다.",
            subs: [
              { t: "High leverage madness", d: "고배율 레버러지가 얼마나 광적으로 많이 걸렸는지 보여 줍니다. L1~10, S1~10으로 표현되며, L은 롱이 많음, S는 숏이 많음을 뜻합니다. 1에서 10으로 올라갈수록 그 정도가 커집니다." },
              { t: "Pitched battle", d: "롱과 숏 세력이 맞붙어 있는 상태입니다. 먼저 자리 잡은 쪽이 흔들리는 방향으로 움직일 가능성이 있는 상태로 볼 수 있어요. 롱/숏 구분 없이 1~10 숫자로만 표현되고, 5 이상은 대회전 등급입니다. 숫자가 클수록 그 정도가 커집니다." },
              { t: "Reverse Design Caution (역설계 주의)", d: "쌓여 있는 물량이 개인 투자자가 아니라 세력의 것이어서, 그 물량을 달고 움직일 가능성이 있을 때 나옵니다. L1~10, S1~10으로 표현되며, S는 숏 물량을 달고 내려갈 가능성, L은 롱 물량을 달고 올라갈 가능성을 뜻합니다." }
            ] }
        ];
      },
      intro: "지수 게시판에는 시장에 레버리지가 어느 쪽으로 얼마나 쌓여 있는지를 짧은 문구와 숫자로 알려 주는 신호가 올라옵니다.\n포지션이 한쪽으로 크게 쏠릴수록, 어느 순간 반대 방향으로 움직이며 쌓여 있던 물량이 정리되는 모습이 자주 나타납니다. 그래서 지수는 \u201C지금 시장이 얼마나 한쪽으로 기울어 있는지\u201D를 가늠해 보는 온도계처럼 활용하실 수 있어요.\n현재는 두 가지 지수가 운영되고 있습니다.\n· DODO_index : 쏠림이 극에 달해 흐름이 바뀔 수 있는 큰 전환 구간을 알려 줍니다.\n· High_Leverage_Frenzy_index : 고배율 레버러지가 얼마나 많이 걸렸는지를 세 가지 신호(High leverage madness, Pitched battle, Reverse Design Caution)로 나누어 보여 줍니다.\n신호는 문구와 숫자로 올라오며, 고배광기지수는 숫자가 클수록 그 정도가 커집니다. 올라오는 간격은 일정하지 않고, 라인 게시판의 가격대와 함께 보시면 흐름을 이해하기 더 쉬워요.\n지수는 참고용 신호이며, 항상 같은 결과가 나오는 것은 아닙니다. 판단과 매매는 본인의 기준으로 해 주세요." },
  ];
  var html = SECTIONS.map(function (S) {
    var items = S.items ? S.items() : BOARD_INFO.filter(S.pick);
    var cards = items.map(function (b) {
      return '<article class="sg-card"><div class="sg-top"><h3>' + esc(b.name) + '</h3><span class="sg-tier">' + (b.tierLabel || (TIERS[b.minTier] + ' 이상')) + '</span></div>' + (b.badge ? '<span class="sg-badge">' + esc(b.badge) + '</span>' : '') + '' +
        b.summary.split("\n").map(function (t) { return '<p>' + esc(t) + '</p>'; }).join("") +
        (b.subs ? '<ul class="sg-sub">' + b.subs.map(function (x) { return '<li><strong>' + esc(x.t) + '</strong><span>' + esc(x.d) + '</span></li>'; }).join("") + '</ul>' : '') +
        (b.imgs || [b.img]).filter(Boolean).map(function (u) { return '<img class="sg-img" src="' + esc(u) + '" alt="' + esc(b.name) + ' 예시 화면" loading="lazy">'; }).join("") +
        '</article>';
    }).join("");
    return '<section class="section" id="' + S.id + '"><div class="section-head"><h2>' + S.title + '</h2></div>' +
      S.intro.split("\n").map(function (t) { return '<p class="sg-intro">' + t + '</p>'; }).join("") + (S.extra ? '<div class="actions" style="margin:0 0 14px">' + S.extra + '</div>' : '') +
      '<div class="sg-grid">' + cards + '</div></section>';
  }).join("");
  document.getElementById("sg").innerHTML = html;
  if (window.watchSticky) { try { watchSticky(document.querySelector(".sg-nav")); } catch (e) {} }
})();
</script>
</body>
</html>
