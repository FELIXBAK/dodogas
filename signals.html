<!doctype html>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%233f51d6%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3Ed%3C/text%3E%3C/svg%3E">

<body data-page="signals">
<main>
  <div class="container">
    <div class="page-head">
      <p class="eyebrow">signals</p>
      <h1>지표 설명</h1>
      <p class="lead">디스코드에서 올라오는 알림과 차트를 종류별로 나누어 설명합니다. 아래 목차로 원하는 부분으로 바로 이동하세요.</p>
      <p class="callout">이 페이지의 내용은 정보 제공을 위한 참고 자료이며, 특정 종목이나 자산의 매수·매도를 권유하거나 투자 자문을 제공하는 것이 아닙니다. 투자 판단과 그에 따른 결과의 책임은 본인에게 있습니다.</p>
    </div>
    <nav class="g-nav sg-nav" aria-label="목차">
      <a href="#boomboom">붐붐이</a><a href="#line">라인</a><a href="#index">지수</a>
    </nav>
    <div id="sg"></div>
    <section class="section">
      <p class="callout">보는 방법과 해석 기준 등 자세한 내용은 계속 보강될 예정입니다. 궁금한 점은 <a href="support.html">고객센터</a>에서 편하게 문의해 주세요.</p>
    </section>
  </div>
</main>
<script src="data.js"></script>
<script src="boards-data.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var TIERS = ["Basic", "Trillion", "VIP"];
  function info(n) { return BOARD_INFO.filter(function (b) { return b.name === n; })[0] || { minTier: 2, img: "" }; }
  var SECTIONS = [
    { id: "boomboom", title: "붐붐이",
      items: function () {
        var c = info("BOOM-BOOM-Classic"), m = info("붐붐이-m1-테스트"), s1 = info("붐붐이-보조1-테스트"), s2 = info("붐붐이-보조2-테스트");
        return [
          { name: "붐붐이 Lite", tierLabel: "전체 공개", badge: "텔레그램",
            summary: "텔레그램으로 누구나 무료로 보실 수 있는 붐붐이입니다. 단계 표시 없이 \u201CBBBB\u201D 문구와 알림 시각이 초 단위까지 표시됩니다.", imgs: ["img/boomboom-lite.png"] },
          { name: "BOOM-BOOM-Classic", minTier: c.minTier, badge: "클래식 버전",
            summary: "기존 클래식 버전의 붐붐이 알림입니다. BBBBLL1, BBBBSS2 같은 짧은 문구로 올라옵니다. 문구의 L(LL)은 보통 가격이 내려갈 때, S(SS)는 보통 올라갈 때 나타납니다.", imgs: [c.img] },
          { name: "붐붐이 M1", minTier: m.minTier, badge: "베타 테스트",
            summary: "추가 보정이 들어간 붐붐이입니다. 현재는 베타 테스트로 임시 공개 중이며, 검증과 보완을 거쳐 정식 출시를 준비하고 있습니다. \u201CLLLL 1\u201D, \u201CSSSS 2\u201D처럼 단계와 함께 올라오고, 알림 시각이 초 단위까지 표시됩니다.", imgs: [m.img] },
          { name: "붐붐이 보조 v1 · 2 · 3", minTier: Math.max(s1.minTier, s2.minTier), badge: "베타 테스트",
            summary: "붐붐이 알림을 보완해 함께 참고하실 수 있는 보조 알림 3종입니다. 같은 카드 형태로 올라오며, 알림 시각이 초 단위까지 표시됩니다. 현재는 베타 테스트로 임시 공개 중입니다.", imgs: [s1.img, s2.img] }
        ];
      },
      intro: "붐붐이는 시장 데이터를 실시간으로 확인하다가, 정해진 기준에 해당하는 상황이 감지되면 디스코드에 기록해 올리는 알림입니다.\n붐붐이 Lite · M1 · 보조 알림은 알림 시각이 초 단위까지 함께 표시됩니다.\n알림 카드에는 \u201CLLLL 1\u201D, \u201CSSSS 2\u201D처럼 문구와 단계 숫자가 표시되고, 단계는 1단계부터 7단계까지 나뉘어 있습니다. (붐붐이 Lite는 단계 표시가 없습니다.)\n문구의 L(LLLL)은 보통 가격이 내려갈 때, S(SSSS)는 보통 올라갈 때 나타납니다.\n알림은 기록된 데이터이며, 매매 시점이나 이후 가격 방향을 알려 주는 것이 아닙니다. 투자 권유나 자문이 아닌 참고 자료입니다.",
      extra: '<a class="btn" href="' + esc((SERVICES.filter(function (s) { return s.name.indexOf("붐붐이 Lite") === 0; })[0] || {}).link || "#") + '" target="_blank" rel="noopener">텔레그램 붐붐이 Lite 열기</a>' },
    { id: "line", title: "라인",
      items: function () {
        var b1 = info("BOOST-PHASE_Line"), b2 = info("MID-COURSE_Line"), b3 = info("APOCALYPTIC_Line");
        function more(n, t) { var x = info(n); x.name = n; x.badge = "종목별 라인"; x.summary = t; return x; }
        return [
          { name: "BOOST-PHASE_Line", minTier: b1.minTier, badge: "단기 라인", imgs: [b1.img],
            summary: "로켓이 발사 직후 가장 먼저 점화하는 \u201C부스트 단계\u201D에서 이름을 따왔습니다. 현재 가격과 가까운 가격대를 표시한 단기 라인으로, 새 라인이 비교적 빠르게 올라옵니다." },
          { name: "MID-COURSE_Line", minTier: b2.minTier, badge: "중장기 라인", imgs: [b2.img],
            summary: "로켓이 비행 중간 구간을 지나는 \u201C미드코스 단계\u201D에서 이름을 따왔습니다. 현재 가격에서 조금 더 떨어진 가격대를 표시한 중장기 라인으로, 부스트 라인보다 올라오는 주기가 깁니다." },
          { name: "APOCALYPTIC_Line", minTier: b3.minTier, badge: "장기 라인", imgs: [b3.img],
            summary: "로켓 발사의 마지막, 종말 단계에서 이름을 따왔습니다. 현재 가격에서 멀리 떨어진 가격대를 표시한 장기 라인으로, 올라오는 주기가 가장 깁니다." },
          more("Line-altcoins", "알트코인 차트에 운영자가 가격대 정보를 표시해 올립니다. 멤버십 회원분이 보고 싶은 코인을 요청해 주시면 운영자가 확인 후 올릴 수 있으나, 모든 요청이 반영되는 것은 아니며 개별 상담이나 맞춤 의견은 제공하지 않습니다. 모든 회원에게 동일하게 공유되는 공통 자료입니다."),
          more("Line-NASDAQ", "나스닥 차트에 운영자가 가격대 정보를 표시해 올립니다."),
          more("Line-METALS", "금속 종목 차트에 운영자가 가격대 정보를 표시해 올립니다."),
          more("Line-KOSPI", "코스피 차트에 운영자가 가격대 정보를 표시해 올립니다.")
        ];
      },
      intro: "라인은 운영자가 TradingView 차트에 직접 표시해 올리는 가격대 정보입니다.\n표시된 가격대에서의 가격 움직임은 매번 다르며, 어떤 결과도 예측하거나 보장하지 않습니다. 라인은 매수·매도 시점을 알려 주는 기준이 아니라, 차트 위 가격대를 한눈에 보기 위한 참고 정보입니다.\n보는 방법은 간단해요.\n① 올라온 라인 이미지에서 현재 가격과 라인 사이의 거리를 확인합니다.\n② 같은 가격대라도 결과는 달라질 수 있으므로, 다른 자료와 함께 참고합니다.\n라인은 정보 제공을 위한 참고 자료이며 투자 권유나 자문이 아닙니다. 투자 판단과 책임은 본인에게 있습니다." },
    { id: "index", title: "지수",
      items: function () {
        var d = info("DODO_index"), h = info("High_Leverage_Frenzy_index");
        return [
          { name: "DODO_index", minTier: d.minTier, imgs: [d.img],
            summary: "시장의 롱·숏 쏠림 정도를 문구와 숫자로 보여 주는 지표입니다. 시장이 한쪽으로 크게 치우치고 전체적으로 쌓인 레버리지가 많아졌을 때 기록됩니다.\n문구의 L은 롱이 많음, S는 숏이 많음을 뜻하며, 숫자가 클수록 쏠림의 정도가 큽니다. 기록은 정해진 시간이 아니라 조건에 해당할 때마다 올라오며, 이후 가격 방향이나 결과를 예측하거나 보장하지 않습니다." },
          { name: "High_Leverage_Frenzy_index", minTier: h.minTier, badge: "신규 오픈", imgs: [h.img],
            summary: "고배율 레버러지가 얼마나 많이 걸렸는지를 보여 주는 지수입니다. 아래 세 가지 표시가 있으며, 조건에 해당할 때마다 올라옵니다.",
            subs: [
              { t: "High leverage madness", d: "고배율 레버러지가 많이 걸린 정도를 보여 줍니다. L1~10, S1~10으로 표현되며, L은 롱이 많음, S는 숏이 많음을 뜻합니다. 숫자가 클수록 그 정도가 큽니다." },
              { t: "Pitched battle", d: "롱과 숏 포지션이 팽팽하게 맞선 정도를 보여 줍니다. 롱/숏 구분 없이 1~10 숫자로만 표현되고, 5 이상은 ‘대회전’ 등급으로 분류합니다. 숫자가 클수록 그 정도가 큽니다." },
              { t: "Reverse Design Caution (역설계 주의)", d: "쌓여 있는 물량이 개인이 아닌 대형 주체의 것으로 추정되는 정도를 보여 줍니다. L1~10, S1~10으로 표현되며, L은 롱 물량, S는 숏 물량 쪽을 뜻합니다. 숫자가 클수록 그 정도가 큽니다." }
            ] }
        ];
      },
      intro: "지수 게시판에는 시장에 레버리지가 어느 쪽으로 얼마나 쌓여 있는지를 짧은 문구와 숫자로 보여 주는 지표가 올라옵니다.\n지수는 \u201C지금 시장의 포지션이 얼마나 한쪽으로 기울어 있는지\u201D를 수치로 확인하는 참고 지표이며, 이후 가격 방향이나 결과를 예측하지 않습니다.\n현재는 두 가지 지수가 운영되고 있습니다.\n· DODO_index : 시장의 롱·숏 쏠림 정도를 문구와 숫자로 보여 줍니다.\n· High_Leverage_Frenzy_index : 고배율 레버러지가 얼마나 많이 걸렸는지를 세 가지 표시(High leverage madness, Pitched battle, Reverse Design Caution)로 나누어 보여 줍니다.\n표시는 문구와 숫자로 올라옵니다. 문구의 L은 롱이 많음, S는 숏이 많음을 뜻하고(Pitched battle은 롱·숏 구분 없이 숫자만 표시), 두 지수 모두 숫자가 클수록 그 정도가 큽니다. 표시는 정해진 시간이 아니라 조건에 해당할 때마다 올라옵니다.\n지수는 정보 제공을 위한 참고 지표이며 투자 권유나 자문이 아닙니다. 투자 판단과 책임은 본인에게 있습니다." },
  ];
  var html = SECTIONS.map(function (S) {
    var items = S.items ? S.items() : BOARD_INFO.filter(S.pick);
    var cards = items.map(function (b) {
      return '<article class="sg-card"><div class="sg-top"><h3>' + esc(b.name) + '</h3><span class="sg-tier">' + (b.tierLabel || (TIERS[b.minTier] + ' 이상')) + '</span></div>' + (b.badge ? '<span class="sg-badge">' + esc(b.badge) + '</span>' : '') + '' +
        b.summary.split("\n").map(function (t) { return '<p>' + esc(t) + '</p>'; }).join("") +
        (b.subs ? '<ul class="sg-sub">' + b.subs.map(function (x) { return '<li><strong>' + esc(x.t) + '</strong><span>' + esc(x.d) + '</span></li>'; }).join("") + '</ul>' : '') +
        (b.imgs || [b.img]).filter(Boolean).map(function (u) { return '<img class="sg-img" src="' + esc(u) + '" alt="' + esc(b.name) + ' 예시 화면" loading="lazy">'; }).join("") +
        '</article>';
    }).join("");
    return '<section class="section" id="' + S.id + '"><div class="section-head"><h2>' + S.title + '</h2></div>' +
      S.intro.split("\n").map(function (t) { return '<p class="sg-intro">' + t + '</p>'; }).join("") + (S.extra ? '<div class="actions" style="margin:0 0 14px">' + S.extra + '</div>' : '') +
      '<div class="sg-grid">' + cards + '</div></section>';
  }).join("");
  document.getElementById("sg").innerHTML = html;
  if (window.watchSticky) { try { watchSticky(document.querySelector(".sg-nav")); } catch (e) {} }
})();
</script>
</body>
</html>
