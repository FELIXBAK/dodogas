<!doctype html>
<html lang="ja" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指標の説明 | dodogas</title>
<meta name="description" content="Boomboomアラート、ライン、指数の各掲示板を、ひとつのページで詳しく説明します。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%233f51d6%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3Ed%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="signals">
<main>
  <div class="container">
    <div class="page-head">
      <p class="eyebrow">signals</p>
      <h1>指標の説明</h1>
      <p class="lead">Discordに上がるアラートとチャートを種類別に説明します。下の目次から見たい部分へ直接移動できます。</p>
      <p class="callout">このページの内容は情報提供を目的とした参考資料であり、特定の銘柄や資産の売買を勧誘したり、投資助言を行ったりするものではありません。投資の判断と、その結果に対する責任はご自身にあります。</p>
    </div>
    <nav class="g-nav sg-nav" aria-label="目次">
      <a href="#boomboom">Boomboom</a><a href="#line">ライン</a><a href="#index">指数</a>
    </nav>
    <div id="sg"></div>
    <section class="section">
      <p class="callout">見方や解釈の基準など、詳しい内容は今後も随時追加していきます。ご不明な点は <a href="support.html">サポート</a>までお気軽にお問い合わせください。</p>
    </section>
  </div>
</main>
<script src="data.js"></script>
<script src="boards-data.js"></script>
<script src="../site.js"></script>
<script>
(function () {
  var TIERS = ["Basic", "Trillion", "VIP"];
  function info(n) { return BOARD_INFO.filter(function (b) { return b.name === n; })[0] || { minTier: 2, img: "" }; }
  var SECTIONS = [
    { id: "boomboom", title: "Boomboom",
      items: function () {
        var c = info("BOOM-BOOM-Classic"), m = info("boomboom-m1-test"), s1 = info("boomboom-sub1-test"), s2 = info("boomboom-sub2-test");
        return [
          { name: "Boomboom Lite", tierLabel: "全体公開", badge: "テレグラム",
            summary: "テレグラムで誰でも無料で見られるBoomboomです。段階表示はなく、「BBBB」の文言とアラート時刻が秒単位まで表示されます。", imgs: ["../img/boomboom-lite.png"] },
          { name: "BOOM-BOOM-Classic", minTier: c.minTier, badge: "クラシック版",
            summary: "従来のクラシック版のBoomboomアラートです。BBBBLL1、BBBBSS2のような短い文言で投稿されます。文言のL(LL)は通常、価格が下がるとき、S(SS)は通常、上がるときに現れます。", imgs: [c.img] },
          { name: "Boomboom M1", minTier: m.minTier, badge: "ベータテスト",
            summary: "追加補正を加えたBoomboomです。現在はベータテストとして一時公開中で、検証と改善を重ねて正式リリースを準備しています。「LLLL 1」「SSSS 2」のように段階とともに投稿され、アラート時刻が秒単位まで表示されます。", imgs: [m.img] },
          { name: "Boomboom 補助 v1 · 2 · 3", minTier: Math.max(s1.minTier, s2.minTier), badge: "ベータテスト",
            summary: "Boomboomアラートを補い、あわせて参考にできる補助アラート3種です。同じカード形式で上がり、アラート時刻が秒単位まで表示されます。現在はベータテストとして一時公開中です。", imgs: [s1.img, s2.img] }
        ];
      },
      intro: "Boomboomは、市場データをリアルタイムで確認し、決められた基準に該当する状況を検知すると、Discordにアラートとして記録して投稿します。\nBoomboom Lite・M1・補助アラートは、アラート時刻が秒単位まで併せて表示されます。\nアラートカードには「LLLL 1」「SSSS 2」のように文言と段階の数字が表示され、段階は1段階から7段階まで分かれています。(Boomboom Liteには段階表示がありません。)\n文言のL(LLLL)は通常、価格が下がるとき、S(SSSS)は通常、上がるときに現れます。\nアラートは記録されたデータであり、売買のタイミングやその後の価格の方向を示すものではありません。投資の勧誘や助言ではなく、参考資料です。",
      extra: '<a class="btn" href="' + esc((SERVICES.filter(function (s) { return s.name.indexOf("Boomboom Lite") === 0; })[0] || {}).link || "#") + '" target="_blank" rel="noopener">テレグラムでBoomboom Liteを開く</a>' },
    { id: "line", title: "ライン",
      items: function () {
        var b1 = info("BOOST-PHASE_Line"), b2 = info("MID-COURSE_Line"), b3 = info("APOCALYPTIC_Line");
        function more(n, t) { var x = info(n); x.name = n; x.badge = "銘柄別ライン"; x.summary = t; return x; }
        return [
          { name: "BOOST-PHASE_Line", minTier: b1.minTier, badge: "短期ライン", imgs: [b1.img],
            summary: "ロケットが打ち上げ直後に最初に点火する「ブースト段階」にちなんで名付けました。現在価格に近い価格帯を表示する短期ラインで、新しいラインが比較的早く投稿されます。" },
          { name: "MID-COURSE_Line", minTier: b2.minTier, badge: "中長期ライン", imgs: [b2.img],
            summary: "ロケットが飛行の中間区間を通過する「ミッドコース段階」にちなんで名付けました。現在価格からやや離れた価格帯を表示する中長期ラインで、ブーストラインより投稿の周期が長めです。" },
          { name: "APOCALYPTIC_Line", minTier: b3.minTier, badge: "長期ライン", imgs: [b3.img],
            summary: "ロケット打ち上げの最後、終末段階にちなんで名付けました。現在価格から遠く離れた価格帯を表示する長期ラインで、投稿の周期が最も長くなります。" },
          more("Line-altcoins", "アルトコインのチャートに、運営者が価格帯の情報を表示して投稿します。会員の方が見たいコインをリクエストすると、運営者が確認のうえ投稿する場合がありますが、すべてのリクエストが反映されるわけではなく、個別の相談やお一人おひとりへの意見の提供は行いません。すべての会員に同じように共有される共通資料です。"),
          more("Line-NASDAQ", "ナスダックのチャートに、運営者が価格帯の情報を表示して投稿します。"),
          more("Line-METALS", "金属銘柄のチャートに、運営者が価格帯の情報を表示して投稿します。"),
          more("Line-KOSPI", "KOSPIのチャートに、運営者が価格帯の情報を表示して投稿します。")
        ];
      },
      intro: "ラインは、運営者がTradingViewのチャートに直接表示して投稿する価格帯の情報です。\n表示された価格帯での値動きは毎回異なり、どのような結果も予測・保証しません。ラインは売買のタイミングを示す基準ではなく、チャート上の価格帯をひと目で確認するための参考情報です。\n見方は簡単です。\n① 投稿されたライン画像で、現在価格とラインとの距離を確認します。\n② 同じ価格帯でも結果は変わりうるため、ほかの資料とあわせて参考にします。\nラインは情報提供を目的とした参考資料であり、投資の勧誘や助言ではありません。投資の判断と責任はご自身にあります。" },
    { id: "index", title: "指数",
      items: function () {
        var d = info("DODO_index"), h = info("High_Leverage_Frenzy_index");
        return [
          { name: "DODO_index", minTier: d.minTier, imgs: [d.img],
            summary: "市場のロングとショートの偏りの度合いを、文言と数字で示す指標です。市場が一方向に大きく偏り、全体として積み上がったレバレッジが多くなったときに記録されます。\n文言のLはロングが多い、Sはショートが多いことを意味し、数字が大きいほど偏りの度合いが大きくなります。記録は決まった時間ではなく、条件に該当するたびに投稿され、その後の価格の方向や結果を予測・保証するものではありません。" },
          { name: "High_Leverage_Frenzy_index", minTier: h.minTier, badge: "新規オープン", imgs: [h.img],
            summary: "高レバレッジがどれほど積み上がっているかを示す指数です。以下の3つの表示があり、条件に該当するたびに投稿されます。",
            subs: [
              { t: "High leverage madness", d: "高レバレッジが積み上がっている度合いを示します。L1~10、S1~10で表され、Lはロングが多い、Sはショートが多いことを意味します。数字が大きいほど度合いが大きくなります。" },
              { t: "Pitched battle", d: "ロングとショートのポジションが拮抗している度合いを示します。ロング/ショートの区別なく1~10の数字だけで表され、5以上は「大会戦」グレードに分類されます。数字が大きいほど度合いが大きくなります。" },
              { t: "Reverse Design Caution(逆設計注意)", d: "積み上がっている建玉が、個人ではなく大口の主体のものと推定される度合いを示します。L1~10、S1~10で表され、Lはロング、Sはショートの建玉側を意味します。数字が大きいほど度合いが大きくなります。" }
            ] }
        ];
      },
      intro: "指数掲示板には、市場にレバレッジがどちら側にどれほど積み上がっているかを、短い文言と数字で示す指標が投稿されます。\n指数は、「今、市場のポジションがどれほど一方向に偏っているか」を数値で確認するための参考指標であり、その後の価格の方向や結果を予測するものではありません。\n現在は2種類の指数が運営されています。\n· DODO_index:市場のロング・ショートの偏りの度合いを、文言と数字で示します。\n· High_Leverage_Frenzy_index:高レバレッジがどれほど積み上がっているかを、3つの表示(High leverage madness、Pitched battle、Reverse Design Caution)に分けて示します。\n表示は文言と数字で投稿されます。文言のLはロングが多い、Sはショートが多いことを意味し(Pitched battleはロング/ショートの区別なく数字のみ表示)、2つの指数とも数字が大きいほど度合いが大きくなります。表示は決まった時間ではなく、条件に該当するたびに投稿されます。\n指数は情報提供を目的とした参考指標であり、投資の勧誘や助言ではありません。投資の判断と責任はご自身にあります。" },
  ];
  var html = SECTIONS.map(function (S) {
    var items = S.items ? S.items() : BOARD_INFO.filter(S.pick);
    var cards = items.map(function (b) {
      return '<article class="sg-card"><div class="sg-top"><h3>' + esc(b.name) + '</h3><span class="sg-tier">' + (b.tierLabel || (TIERS[b.minTier] + ' 以上')) + '</span></div>' + (b.badge ? '<span class="sg-badge">' + esc(b.badge) + '</span>' : '') + '' +
        b.summary.split("\n").map(function (t) { return '<p>' + esc(t) + '</p>'; }).join("") +
        (b.subs ? '<ul class="sg-sub">' + b.subs.map(function (x) { return '<li><strong>' + esc(x.t) + '</strong><span>' + esc(x.d) + '</span></li>'; }).join("") + '</ul>' : '') +
        (b.imgs || [b.img]).filter(Boolean).map(function (u) { return '<img class="sg-img" src="' + esc(u) + '" alt="' + esc(b.name) + ' サンプル画面" loading="lazy">'; }).join("") +
        '</article>';
    }).join("");
    return '<section class="section" id="' + S.id + '"><div class="section-head"><h2>' + S.title + '</h2></div>' +
      S.intro.split("\n").map(function (t) { return '<p class="sg-intro">' + t + '</p>'; }).join("") + (S.extra ? '<div class="actions" style="margin:0 0 14px">' + S.extra + '</div>' : '') +
      '<div class="sg-grid">' + cards + '</div></section>';
  }).join("");
  document.getElementById("sg").innerHTML = html;
  if (window.watchSticky) { try { watchSticky(document.querySelector(".sg-nav")); } catch (e) {} }
})();
</script>
</body>
</html>
