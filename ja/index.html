<!doctype html>
<html lang="ja" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dodogas | 取引所特典・イベント・メンバーシップ案内</title>
<meta name="description" content="取引所の特典、イベント、登録ガイド、メンバーシップ案内をまとめて確認できます。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%233f51d6%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3Ed%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="home">
<main>
  <section class="hero">
    <div class="container">
      <p class="eyebrow">dodogas guide</p>
      <h1>取引所の特典とメンバーシップを<br>ひと目で確認</h1>
      <p class="lead">取引所ごとの登録特典、開催中のイベント、登録・KYCの方法、メンバーシップ別の利用範囲をまとめています。</p>
      <div class="actions">
        <a class="btn" href="events.html">開催中のイベント</a>
        <a class="btn ghost" href="membership.html">メンバーシップ案内</a>
      </div>
    </div>
  </section>

  <div class="container">
    <section class="section">
      <div class="section-head"><h2>取引所特典の比較</h2></div>
      <div class="scroll ex-wrap">
        <table class="ex-table">
          <thead><tr><th data-m="取引所と特典">取引所</th><th>特典</th><th>紹介コード</th><th data-m="紹介コードで登録">登録</th></tr></thead>
          <tbody id="ex-body"></tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <div class="card cta-card">
        <div>
          <h3>取引所への登録はお済みですか?</h3>
          <p>登録後に提供される資料とVIP権限を確認しましょう。</p>
        </div>
        <a class="btn" href="vip.html">VIP権限・資料を見る →</a>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2>提供サービス</h2></div>
      <div class="grid" id="sv-grid"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>開催中のイベント</h2><a href="events.html">すべて見る</a></div>
      <div class="grid" id="ev-grid"></div>
    </section>

    <section class="section">
      <div class="card cta-card">
        <div>
          <h3>メンバーシップ別の利用範囲</h3>
          <p>Basic・Trillion・VIPの各段階で見られる掲示板を一目で比較します。</p>
        </div>
        <a class="btn" href="membership.html">メンバーシップを見る</a>
      </div>
    </section>
  </div>
</main>
<script src="data.js"></script>
<script src="../site.js"></script>
<script>
(function () {

  document.getElementById("ex-body").innerHTML = EXCHANGES.map(function (x) {
    var dash = '<span class="dash">–</span>';
    var join = x.link ? '<a class="btn" href="' + esc(x.link) + '" rel="noopener" target="_blank">登録する</a>' : dash;
    return "<tr><th scope=\"row\"><span class=\"ex-name\">" + (x.icon ? '<img class="ex-ico" src="' + esc(x.icon) + '" alt="" width="28" height="28">' : '<span class="ex-ico ex-letter" aria-hidden="true">' + esc(x.name.charAt(0)) + "</span>") + "<span>" + esc(x.name) + "</span></span></th><td>" + (esc(x.benefit) || dash) + "</td><td>" + (x.code ? '<button type="button" class="copy-code" data-code="' + esc(x.code) + '" title="クリックでコピー"><span class="cp-text">' + esc(x.code) + '</span><svg class="cp-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>' : dash) + "</td><td>" + join + "</td></tr>";
  }).join("");


  var SV_ICONS = {
    discord: ["#6d78ff", "#4752e0", '<path fill="#fff" d="M6 5h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.2L7.6 21.2c-.6.5-1.6.1-1.6-.7V18a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"/><circle cx="8.6" cy="11.5" r="1.45" fill="#4f5be8"/><circle cx="12" cy="11.5" r="1.45" fill="#4f5be8"/><circle cx="15.4" cy="11.5" r="1.45" fill="#4f5be8"/>'],
    youtube: ["#ff3b30", "#e01b10", '<path fill="#fff" d="M9 7.3v9.4c0 .8.9 1.3 1.6.9l7.6-4.7c.6-.4.6-1.4 0-1.8l-7.6-4.7C9.9 6 9 6.5 9 7.3z"/>'],
    cafe: ["#2fd35c", "#14a83d", '<path fill="#fff" d="M4.5 10h11.5v4.2A4.8 4.8 0 0 1 11.2 19H9.3a4.8 4.8 0 0 1-4.8-4.8z"/><path fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" d="M16 11.3h1.3a2.1 2.1 0 0 1 0 4.2H15.8"/><path fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" d="M8 4.5c-.8.9.8 1.6 0 2.6M11.3 4.5c-.8.9.8 1.6 0 2.6"/>'],
    telegram: ["#3db4ea", "#1f8fd0", '<path fill="#fff" d="M19.8 4.7 3.9 10.9c-.9.4-.9 1.6 0 1.9l3.9 1.4 1.5 4.7c.2.7 1.1.9 1.6.4l2.2-2.1 3.9 2.9c.6.4 1.4.1 1.6-.6l2.6-13.4c.2-.9-.6-1.7-1.4-1.4z"/><path fill="#1f8fd0" d="m9.1 14.4 7.2-6.1-6 6.9-.3 2.8z" opacity=".55"/>'],
    chart: ["#ffb020", "#f07c00", '<path fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m4.5 16 4.5-4.5 3.5 3 6.5-7"/><path fill="#fff" d="M15.2 6.3h4.6a.7.7 0 0 1 .7.7v4.6c0 .6-.8.9-1.2.5l-4.6-4.6c-.4-.4-.1-1.2.5-1.2z"/>']
  };
  function svIcon(k) {
    if (!k) return "";
    if (/\.(png|jpe?g|svg|webp)$/i.test(k)) return '<img class="sv-ico" src="' + esc(k) + '" alt="" width="48" height="48">';
    var x = SV_ICONS[k];
    return x ? '<span class="sv-ico" style="--c1:' + x[0] + ";--c2:" + x[1] + '" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28">' + x[2] + "</svg></span>" : "";
  }
  document.getElementById("sv-grid").innerHTML = SERVICES.map(function (v) {
    var btn = v.link ? '<a class="btn" href="' + esc(v.link) + '" rel="noopener" target="_blank">開く</a>' : '';
    return '<article class="card"><div class="sv-top"><div class="sv-name">' + svIcon(v.icon) + '<h3>' + esc(v.name) + '</h3></div><span class="tag">' + esc(v.tag) + '</span></div><p>' + esc(v.desc) + '</p>' + (v.access ? '<div class="meta">' + esc(v.access) + '</div>' : '') + '<p>' + btn + '</p></article>';
  }).join("");



  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return new Promise(function (ok, fail) {
      try {
        var a = document.createElement("textarea");
        a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
        document.body.appendChild(a); a.select();
        var done = document.execCommand("copy");
        document.body.removeChild(a);
        done ? ok() : fail();
      } catch (e) { fail(e); }
    });
  }
  document.getElementById("ex-body").addEventListener("click", function (e) {
    var b = e.target.closest(".copy-code");
    if (!b) return;
    var code = b.getAttribute("data-code");
    var txt = b.querySelector(".cp-text"), icon = b.querySelector(".cp-ico");
    var iconCopy = icon.outerHTML;
    var iconCheck = '<svg class="cp-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';
    function reset() { txt.textContent = code; b.classList.remove("copied"); b.querySelector(".cp-ico").outerHTML = iconCopy; }
    copyText(code).then(function () {
      txt.textContent = "コピーしました"; b.classList.add("copied"); b.querySelector(".cp-ico").outerHTML = iconCheck;
    }, function () {
      txt.textContent = "長押しでコピー";
    }).then(function () { setTimeout(reset, 1500); });
  });

  var today = new Date().toISOString().slice(0, 10);
  var live = EVENTS.filter(function (e) { return !e.end || e.end >= today; }).slice(0, 3);
  var grid = document.getElementById("ev-grid");
  grid.innerHTML = live.length ? live.map(function (e) {
    return '<article class="card"><span class="tag">' + esc(e.tag) + '</span><h3>' + esc(e.title) + '</h3><p>' + esc(e.desc) + '</p><div class="meta">' + esc(e.exchange) + ' · ' + esc(e.start) + ' ~ ' + esc(e.end) + '</div></article>';
  }).join("") : '<div class="empty">現在開催中のイベント・大会はありません。</div>';
})();
</script>
</body>
</html>
