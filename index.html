<script>
(function () {

  document.getElementById("ex-body").innerHTML = EXCHANGES.map(function (x) {
    var dash = '<span class="dash">–</span>';
    var join = x.link ? '<a class="btn" href="' + esc(x.link) + '" rel="noopener" target="_blank">가입하기</a>' : dash;
    return "<tr><th scope=\"row\"><span class=\"ex-name\">" + (x.icon ? '<img class="ex-ico" src="' + esc(x.icon) + '" alt="" width="28" height="28">' : '<span class="ex-ico ex-letter" aria-hidden="true">' + esc(x.name.charAt(0)) + "</span>") + "<span>" + esc(x.name) + "</span></span></th><td>" + (esc(x.benefit) || dash) + "</td><td>" + (x.code ? '<button type="button" class="copy-code" data-code="' + esc(x.code) + '" title="클릭하면 복사됩니다"><span class="cp-text">' + esc(x.code) + '</span><svg class="cp-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>' : dash) + "</td><td>" + join + "</td></tr>";
  }).join("");

  // 제공 서비스 아이콘: 둥근 색 배지 + 흰색 그림 (로고 이미지 경로를 주면 이미지로 표시)
  var SV_ICONS = {
    discord: ["#6d78ff", "#4752e0", '<path fill="#fff" d="M6 5h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.2L7.6 21.2c-.6.5-1.6.1-1.6-.7V18a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"/><circle cx="8.6" cy="11.5" r="1.45" fill="#4f5be8"/><circle cx="12" cy="11.5" r="1.45" fill="#4f5be8"/><circle cx="15.4" cy="11.5" r="1.45" fill="#4f5be8"/>'],
    youtube: ["#ff3b30", "#e01b10", '<path fill="#fff" d="M9 7.3v9.4c0 .8.9 1.3 1.6.9l7.6-4.7c.6-.4.6-1.4 0-1.8l-7.6-4.7C9.9 6 9 6.5 9 7.3z"/>'],
    cafe: ["#2fd35c", "#14a83d", '<path fill="#fff" d="M4.5 10h11.5v4.2A4.8 4.8 0 0 1 11.2 19H9.3a4.8 4.8 0 0 1-4.8-4.8z"/><path fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" d="M16 11.3h1.3a2.1 2.1 0 0 1 0 4.2H15.8"/><path fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" d="M8 4.5c-.8.9.8 1.6 0 2.6M11.3 4.5c-.8.9.8 1.6 0 2.6"/>'],
    telegram: ["#3db4ea", "#1f8fd0", '<path fill="#fff" d="M19.8 4.7 3.9 10.9c-.9.4-.9 1.6 0 1.9l3.9 1.4 1.5 4.7c.2.7 1.1.9 1.6.4l2.2-2.1 3.9 2.9c.6.4 1.4.1 1.6-.6l2.6-13.4c.2-.9-.6-1.7-1.4-1.4z"/><path fill="#1f8fd0" d="m9.1 14.4 7.2-6.1-6 6.9-.3 2.8z" opacity=".55"/>'],
    chart: ["#ffb020", "#f07c00", '<path fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m4.5 16 4.5-4.5 3.5 3 6.5-7"/><path fill="#fff" d="M15.2 6.3h4.6a.7.7 0 0 1 .7.7v4.6c0 .6-.8.9-1.2.5l-4.6-4.6c-.4-.4-.1-1.2.5-1.2z"/>']
  };
  function svIcon(k) {
    if (!k) return "";
    if (/\.(png|jpe?g|svg|webp)$/i.test(k)) return '<img class="sv-ico" src="' + esc(k) + '" alt="" width="48" height="48">';
    var x = SV_ICONS[k];
    return x ? '<span class="sv-ico" style="--c1:' + x[0] + ";--c2:" + x[1] + '" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28">' + x[2] + "</svg></span>" : "";
  }
  document.getElementById("sv-grid").innerHTML = SERVICES.map(function (v) {
    var btn = v.link ? '<a class="btn" href="' + esc(v.link) + '" rel="noopener" target="_blank">바로가기</a>' : '';
    return '<article class="card"><div class="sv-top"><div class="sv-name">' + svIcon(v.icon) + '<h3>' + esc(v.name) + '</h3></div><span class="tag">' + esc(v.tag) + '</span></div><p>' + esc(v.desc) + '</p>' + (v.access ? '<div class="meta">' + esc(v.access) + '</div>' : '') + '<p>' + btn + '</p></article>';
  }).join("");


  // 추천인 코드를 누르면 복사됩니다.
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return new Promise(function (ok, fail) {
      try {
        var a = document.createElement("textarea");
        a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
        document.body.appendChild(a); a.select();
        var done = document.execCommand("copy");
        document.body.removeChild(a);
        done ? ok() : fail();
      } catch (e) { fail(e); }
    });
  }
  document.getElementById("ex-body").addEventListener("click", function (e) {
    var b = e.target.closest(".copy-code");
    if (!b) return;
    var code = b.getAttribute("data-code");
    var txt = b.querySelector(".cp-text"), icon = b.querySelector(".cp-ico");
    var iconCopy = icon.outerHTML;
    var iconCheck = '<svg class="cp-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';
    function reset() { txt.textContent = code; b.classList.remove("copied"); b.querySelector(".cp-ico").outerHTML = iconCopy; }
    copyText(code).then(function () {
      txt.textContent = "복사됨"; b.classList.add("copied"); b.querySelector(".cp-ico").outerHTML = iconCheck;
    }, function () {
      txt.textContent = "길게 눌러 복사";
    }).then(function () { setTimeout(reset, 1500); });
  });

})();
</script>
</body>
